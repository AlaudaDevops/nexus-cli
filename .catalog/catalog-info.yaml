apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: nexus-cli
  title: Nexus CLI (Test Tool)
  description: Nexus Repository Manager 自动化管理命令行工具，通过 YAML 配置文件批量创建用户、仓库等测试数据。主要用于集成测试和 e2e 测试流程。不随产品发布。
  tags:
    - test-tool
    - internal-tool
    - nexus
    - go
  links:
    - url: https://github.com/AlaudaDevops/nexus-cli
      title: GitHub Repository
      icon: github
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/nexus-cli
    # backstage techdocs plugin — dir:../ points to the repo root from .catalog/
    backstage.io/techdocs-ref: dir:../
    acp.cpaas.io/owner: huanyang@alauda.io
    # internal — used only in test automation, not shipped to customers
    acp.cpaas.io/functional-attributes: internal

spec:
  type: tool
  system: system:alauda-devops-internal
  lifecycle: experimental
  owner: devops
